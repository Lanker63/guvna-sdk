phase: 2
authority_gate: Gate 2 - Semantic IR Authority Gate
status: APPROVED
gap_2_serialization:
  status: APPROVED
  authority_status: APPROVED
  decision: "Propose compact JSON encoded as UTF-8 without BOM for the approved SemanticIR structure."
  object_member_order: "Fixed order of fields in the approved TypeScript interface definitions; does not order collections."
  array_order: "Preserve supplied order; serialization does not sort, deduplicate, or reorder collections."
  absent_optional_fields: omit
  empty_required_collections: emit_as_empty_array
  undefined_values: serialization_error
  primitive_rules:
    strings: "Quote-delimited Unicode scalar values encoded as UTF-8; quote and backslash use \\\" and \\\\; U+0000..U+001F use short escapes for backspace/tab/line-feed/form-feed/carriage-return and otherwise \\u plus four uppercase hex digits; all other scalar values emit directly; unpaired surrogates and invalid scalars are errors; no Unicode normalization"
    booleans: "JSON true or false"
    null: "Allowed only where the approved TypeScript type permits null"
    numbers: "Finite IEEE-754 binary64 values; non-zero values use the shortest base-ten decimal that round-trips identically, ties choose an even final significand digit then lexicographically smaller significand digits; plain form for decimal exponent -6..20 inclusive, scientific form otherwise; lowercase e, no exponent leading zeros, plus only for positive exponents, no unnecessary decimal point or trailing fractional zeros; integers have no leading zeros or plus sign; negative zero emits as 0; NaN, infinities, bigint, and non-finite values are errors"
    unknown_attributes: "Recursively JSON-compatible values only; non-JSON values are serialization errors"
  excludes:
    - normalization
    - canonical ordering of collections
    - deterministic identity
    - hashing
    - compatibility
    - applicability
    - lifecycle
    - delegation and revocation
    - compiler implementation
gap_2_normalization:
  status: APPROVED
  authority_status: APPROVED
  decision: "Propose meaning-preserving normalization only where an approved semantic equivalence rule explicitly authorizes the transformation."
  preserves:
    - approved TypeScript structure
    - field cardinality and optionality
    - semantic concepts and distinctions
    - provenance and attributable transformations
  prohibited:
    - inferred semantic meaning
    - default insertion
    - absent-to-null conversion
    - collection sorting
    - collection deduplication
    - collection merging or splitting
    - reference resolution
    - authority or conflict resolution
    - compatibility or applicability determination
    - Unicode normalization
    - numeric widening or rounding
  ambiguity_behavior: "Preserve without transformation or fail closed when producing the requested normalized form requires choosing among meanings."
  excludes:
    - canonical ordering of collections
    - deterministic identity
    - hashing
    - compatibility
    - applicability
    - lifecycle
    - delegation and revocation
    - compiler implementation
gap_2_collection_ordering:
  status: APPROVED
  authority_status: APPROVED
  decision: "Propose ordering only for collections already approved as semantically unordered, using lexicographic unsigned-byte comparison of each element's approved SemanticIdentity JSON/UTF-8 serialization."
  ordered_collections: "Retain supplied order."
  unordered_collections: "Order by SemanticIdentity serialization bytes."
  equal_identity_keys: "Identical serialized elements retain multiplicity; differing serialized elements fail closed."
  empty_collections: remain_empty
  missing_or_unresolved_identity: fail_closed
  excludes:
    - normalization
    - identity generation
    - deterministic identity
    - hashing
    - compatibility
    - applicability
    - lifecycle
    - delegation and revocation
    - compiler implementation
gap_2_identity_generation:
  status: APPROVED
  authority_status: APPROVED
  decision: "Propose preserving authoritative identities and constructing generated-identity preimages from identity kind, semantic scope, and approved canonical serialized semantic content."
  excluded_inputs:
    - filesystem location
    - source path or document position
    - discovery or process order
    - package name
    - runtime address
    - random value
    - timestamp
    - counter
    - generated name
  ambiguity_behavior: fail_closed
  provenance: "Record whether identity was preserved or generated and the semantic inputs used."
  unresolved:
    - deterministic identity-value algorithm
  excludes:
    - compatibility
    - applicability
    - lifecycle
    - delegation and revocation
    - compiler implementation
gap_2_deterministic_identity_value:
  status: APPROVED
  authority_status: APPROVED
  decision: "Propose base64url without padding of the approved acyclic identity-preimage projection's UTF-8 bytes as SemanticIdentity.value."
  preimage_projection:
    includes:
      - explicit identityKind supplied for the object
      - all non-identity fields of the object being identified
      - projected semantic scope with derived identity fields removed
      - nested non-identity fields recursively
    excludes:
      - generated identity field
      - identityKind and value inside the generated identity field
      - nested identity or semanticIdentity fields derived from the same preimage
      - SemanticRef identity values derived from the same preimage
      - placeholders, generated names, object addresses, and traversal indexes
    independent_nested_identity: "Included only when provenance establishes it is not derived from this preimage; otherwise excluded."
    ambiguity_behavior: fail_closed
  preimage: "Acyclic identity-stripped projection determined by approved semantic content, normalization, collection ordering, and serialization rules"
  encoding: "Approved compact JSON followed by UTF-8 without BOM, then RFC 4648 base64url without padding"
  injective: true
  hashing: "Not used or resolved by this proposal"
  failure_behavior: fail_closed
  provenance: "Record preimage inputs and identify the value as an encoding rather than a digest."
  excludes:
    - hash or digest selection
    - compatibility
    - applicability
    - lifecycle
    - delegation and revocation
    - compiler implementation
gap_2_hash_or_digest_selection:
  status: APPROVED
  authority_status: APPROVED
  decision: "Propose SHA-256 over approved identity-preimage bytes, represented as 64 lowercase hexadecimal ASCII characters."
  input: "Exact approved identity-preimage bytes without metadata or additional framing"
  output: "32-byte SHA-256 result encoded as 64 lowercase hexadecimal ASCII characters"
  identity_value_effect: "None; SemanticIdentity.value remains un-hashed RFC 4648 base64url of the preimage bytes."
  authority_effect: "None; digest does not establish identity, authority, applicability, acceptance, or ratification."
  failure_behavior: fail_closed
  excludes:
    - compatibility
    - applicability
    - lifecycle
    - delegation and revocation
    - compiler implementation
version_compatibility:
  status: APPROVED
  authority_status: APPROVED
  decision: "Propose Semantic Versioning 2.0.0 parsing and precedence plus explicit-requirement compatibility comparison with compatible, incompatible, and indeterminate results."
  version:
    syntax: semver_2_0_0
    build_metadata_affects_precedence: false
    invalid_syntax: validation_failure
  compatibility:
    required_inputs:
      - prior subject
      - candidate subject
      - comparison scope
      - authoritative applicable compatibility requirements
    applicability_source: "Authoritative upstream decision or context; comparison does not determine applicability."
    compatible: "All applicable approved requirements are evaluated and satisfied."
    incompatible: "At least one applicable approved requirement is explicitly violated."
    indeterminate: "The authoritative applicable-requirement set is absent, unresolved, ambiguous, unavailable, or any required input, predicate, scope, or authoritative interpretation is missing or unsupported."
    version_only_inference: prohibited
    applicability_inference: prohibited
    forbidden_applicability_inputs:
      - version numbers
      - requirement type
      - subject or candidate identity
      - implementation changes
      - Runtime or SDK behavior
      - filesystem or document state
      - ordering or precedence assumptions
    provenance: preserve
  excludes:
    - applicability
    - ratification
    - lifecycle
    - delegation and revocation
    - compiler implementation
applicability_determination:
  status: APPROVED
  authority_status: APPROVED
  decision: "Allow the Semantic IR/compiler to determine applicability from authoritative, externally supplied ratification/authority inputs without exercising ratification authority or creating or altering the governing authority decision."
  authority_decision: "Established externally by the governing authority/contract process; not created, altered, or ratified by the Semantic IR/compiler."
  determination: "Evaluate authoritative inputs against the already-established governed scope and required validity/effective-boundary conditions."
  result: "Derived from authoritative inputs, provenance-preserving, fail-closed, and exactly one of applicable, not-applicable, or indeterminate."
  prerequisites:
    - validated contract
    - explicit governing ratification decision
    - exact governed-scope match
    - attributable decision identity and provenance
  results:
    applicable: "Authoritative ratification recognizes the validated contract for the exact governed scope."
    not_applicable: "Authoritative decision explicitly rejects, supersedes, retires, or otherwise does not recognize the contract for that scope."
    indeterminate: "Required decision, validation state, scope match, provenance, effective boundary, or supported interpretation is absent, ambiguous, conflicting, stale, revoked, or unavailable."
  failure_behavior: fail_closed
  prohibited_inference_sources:
    - semantic identity
    - semantic version precedence
    - compatibility result
    - implementation behavior
    - Runtime or SDK behavior
    - filesystem or document state
    - package or cache state
    - repository acceptance
    - generated artifact presence
  provenance: preserve
  representation_may:
    - record the externally established result
    - validate structural consistency and scope matching
    - propagate the decision identity, authority reference, version, effective boundary, and provenance
  representation_must_not:
    - ratify a contract
    - create or alter an authority decision
    - infer applicability
  excludes:
    - ratification actors or workflow
    - authority predicates
    - delegation or revocation mechanics
    - conflict precedence
    - supersession rules
    - effective-time algorithms
    - repository applicability
    - domain-specific applicability conditions
    - compiler, Runtime, SDK, or projection implementation
  approval_limit: "Approved only for applicability determination from authoritative externally supplied inputs and the stated provenance-preserving fail-closed result; no authority creation, authority alteration, contract ratification, or excluded decision is approved."
scope_revision:
  gap: 1
  decision: "Exact TypeScript structure, field cardinality, and field optionality are proposed together as one structural decision."
  authority_status: APPROVED
  excludes:
    - serialization
    - normalization
    - canonical ordering
    - deterministic identity
    - compatibility algorithms
    - applicability algorithms
    - lifecycle and transition algorithms
    - delegation and revocation algorithms
semantic_source: doctrine/core/**
excluded_semantic_sources:
  - doctrine/agentic/**
proposal: .guvna/agent-state/proposals/gate-2-semantic-ir-proposal.md
representation:
  kind: guvna-semantic-ir
  kernel: generic semantic kernel
  domain_specific_ir_types_required: false
  represented_domains:
    - Repository
    - Runtime
    - SDK
    - Host
    - Contract
    - Projection
    - Agent
semantic_decisions_applied:
  - gap: 1
    status: SEMANTICALLY_RESOLVED
    applied: "Normalized, provenance-preserving derived IR with concepts, relationships, constraints, transitions, derivations, identity, lifecycle, scope, meaning, and authority/acceptance context."
  - gap: 2
    status: SEMANTICALLY_RESOLVED
    applied: "Canonical semantic content governs equivalence, normalization, ordering, serialization encoding, and deterministic identity; ambiguity blocks canonicalization."
  - gap: 3
    status: SEMANTICALLY_RESOLVED
    applied: "Authority Decision, Acceptance, Provenance, Uncertainty, and Contradiction remain distinct."
  - gap: 4
    status: SEMANTICALLY_RESOLVED
    applied: "Lifecycle, acceptance, ratification, applicability, supersession, rejection, and retirement remain distinct."
  - gap: 5
    status: SEMANTICALLY_RESOLVED
    applied: "Version and compatibility are semantic and contextual, not filesystem or implementation-derived."
  - gap: 6
    status: SEMANTICALLY_RESOLVED
    applied: "Runtime and SDK are independent realizations sharing applicable contract authority."
  - gap: 7
    status: SEMANTICALLY_RESOLVED
    applied: "Runtime Contracts are Guvna-owned; ratification and applicability remain distinct."
  - gap: 8
    status: SEMANTICALLY_RESOLVED
    applied: "Projection compilation is contract-governed, repository-authority-subordinate, and distinguishes stale, invalid, and incompatible outcomes."
  - gap: 9
    status: SEMANTICALLY_RESOLVED
    applied: "Accepted Repository Knowledge is the authoritative Runtime semantic basis; invalid inputs fail closed or produce contract-defined outcomes."
  - gap: 10
    status: SEMANTICALLY_RESOLVED
    applied: "Established doctrinal authority governs; equal-authority unresolved conflicts block compilation and preserve provenance."
  - gap: 11
    status: SEMANTICALLY_RESOLVED
    applied: "Authority identity and delegation are attributable, contained, capability-separated, provenance-preserving, and non-ratifying by default."
