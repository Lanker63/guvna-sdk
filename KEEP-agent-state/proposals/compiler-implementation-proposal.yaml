phase: 3
authority_gate: Post-Gate 3 implementation scope review
status: APPROVED
applicability_reconciliation:
  status: APPROVED
  gate: Gate 3
  approved_gate_2_scope:
    determine_from_authoritative_external_inputs: true
    evaluate_established_scope_validity_and_effective_boundary: true
    results:
      - applicable
      - not-applicable
      - indeterminate
    provenance_preserving: true
    fail_closed: true
  external_authority:
    ratification_authority_remains_external: true
    governing_decision_creation_or_alteration: false
  implementation_scope_change:
    applicability_determination: "Approved for implementation within the approved Gate 2 boundary."
    candidate_contract_ratification: false
    other_unresolved_gate_2_capabilities: false
  implementation_authorized_by_reconciliation: true
  review_required: false
governing_approval: Gate 3 - Compiler Authority Gate
semantic_source: doctrine/core/**
derived_input: .guvna/agent-state/proposals/gate-2-semantic-ir-proposal.yaml
pipeline:
  - authoritative inputs
  - applicability determination
  - result and provenance
integration_boundary:
  supporting_stages:
    - Discover
    - Parse
    - Normalize
    - Resolve
    - Compile
    - Validate
  authorization: "Only the minimal portion strictly necessary to execute or test Applicability Determination; no general stage implementation."
output:
  derived_semantic_ir: true
  provenance_evidence: true
  semantic_authority: false
  applicable_contract: false
  candidate_contract_ratification: false
integration_checks:
  scope: "Apply only when strictly necessary to execute or test the approved Applicability Determination capability."
  Discover:
    source_boundary: doctrine/core/**
    preserves_source_identity_and_provenance: true
  Parse:
    preserves_source_locations: true
    rejects_malformed_input: true
  Normalize:
    removes_only_established_representational_variance: true
    infers_meaning: false
  Resolve:
    binds_references: true
    reports_unresolved_references: true
    invents_precedence: false
  Compile:
    constructs_approved_generic_semantic_ir: true
    records_transformations: true
  Validate:
    checks_structural_representation: true
    checks_provenance: true
    checks_authority_boundaries: true
    checks_compatibility_applicability_presence_structure_consistency: true
    executes_unresolved_compatibility_applicability_algorithms: false
    executes_approved_applicability_determination: true
    applicability_inputs: authoritative_external_inputs_only
    applicability_results:
      - applicable
      - not-applicable
      - indeterminate
    applicability_fail_closed: true
    applicability_provenance_preserved: true
    no_ratification_or_authority_mutation: true
failure_behavior:
  unresolved_semantic_gaps_fail_closed: true
  unresolved_references_fail_closed: true
  authority_ambiguity_fails_closed: true
  invalid_ownership_fails_closed: true
  provenance_loss_fails_closed: true
  preserve_source_claims_and_provenance: true
unresolved_algorithms_not_implemented:
  - compatibility
  - unresolved applicability-related semantics or algorithms beyond the approved authoritative-input determination boundary
  - serialization
  - hashing
  - ordering
  - version
  - lifecycle
  - transition
  - delegation
  - revocation
  - loading
  - caching
determinism:
  architecture_admits_deterministic_compilation_once_approved_algorithms_are_provided: true
  algorithms_established_by_this_proposal: false
proposed_tests:
  - approved applicability outcomes: applicable, not-applicable, indeterminate
  - applicability fail-closed behavior
  - authoritative-input enforcement
  - exact governed-scope evaluation
  - validity/effective-boundary evaluation
  - applicability provenance preservation
  - prohibition on ratification or authority-decision mutation
  - mutation boundary enforcement
  - downstream artifact non-mutation
mutation_scope:
  exact_paths:
    - core/src/compiler/**/*.ts
    - core/tests/compiler/**/*.test.ts
    - core/tsconfig.json
    - core/vitest.config.mts
    - .guvna/agent-state/evidence/compiler/**/*.yaml
    - .guvna/agent-state/evidence/compiler/**/*.md
  requires_explicit_approval_before_implementation: false
  excluded:
    - doctrine/**
    - core/runtime/**
    - core/sdk/**
    - repository truth
    - Runtime, SDK, Projection, or Contract artifacts
    - publication and generated artifacts
next_action: Execute the approved post-remediation Applicability Determination conformance review
requires_approval: false
