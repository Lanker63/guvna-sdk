    sha256: 4601c488919311ec6e1e21264f054168f394fc4048ceab770077a4b0407b886b
  - path: baseline.md
    kind: architectural-baseline
    sha256: 7ff38211d3665c902900a5ed0e24c8dacf837d122df0eabec17bc748fe5f8dbd
  - path: extracts/semantic-ir.md
