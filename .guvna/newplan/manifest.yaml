exclusions:
  - Contract payloads or reconstructed Contract content
  - Candidate or Applicable Contract artifacts
  - authority-ledger copies, excerpts, or decisions
  - agent-state snapshots
  - doctrine copies
  - Runtime, SDK, Host, repository-projection, persistence, transport, or provider implementations