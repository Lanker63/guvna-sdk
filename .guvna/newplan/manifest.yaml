bundle_kind: planning-baseline
created_on: "2026-08-15"
authority: non-authoritative-derivative
purpose: preserve implementation-ready evidence and a bounded realization plan
source_registry: sources.yaml
validation:
  yaml: ruby -e "require 'yaml'; YAML.load_file('.guvna/newplan/sources.yaml'); YAML.load_file('.guvna/newplan/manifest.yaml')"
  source_hashes: shasum -a 256 -c sources.sha256
  repository: pnpm build && pnpm typecheck && pnpm test
  scope: git diff --name-only
artifacts:
