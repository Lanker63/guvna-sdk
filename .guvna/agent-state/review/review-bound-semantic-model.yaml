per_target_dependency_classifications:
  scope_bootstrap:
    targets: [rbsm-scope-parent-guvna]
    same_preimage_dependency: self
    independent_identity_dependencies: []
  node_targets:
    targets:
      - rbsm-concept-semantic-contract
      - rbsm-concept-accepted-guvna-meaning
      - rbsm-concept-semantic-identity
      - rbsm-concept-semantic-version
      - rbsm-concept-lifecycle-state
      - rbsm-concept-provenance
      - rbsm-concept-uncertainty
      - rbsm-concept-semantic-compilation
      - rbsm-concept-contract-ratification
      - rbsm-concept-guvna-authority
      - rbsm-state-candidate
      - rbsm-state-validated
      - rbsm-state-ratified
      - rbsm-state-applicable
      - rbsm-state-superseded
      - rbsm-state-rejected
      - rbsm-state-retired
      - rbsm-operation-validate
      - rbsm-operation-ratify
      - rbsm-operation-apply
      - rbsm-operation-reject
      - rbsm-operation-supersede
      - rbsm-operation-retire
    same_preimage_dependency: self
    independent_identity_dependencies: [rbsm-scope-parent-guvna]
  relation_targets:
