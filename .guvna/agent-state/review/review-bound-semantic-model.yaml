      - rbsm-relation-meaning-compilation
      - rbsm-relation-compilation-candidate
      - rbsm-relation-ratification-applicable
      - rbsm-relation-identity-realization
      - rbsm-relation-contract-interpretation
    same_preimage_dependency: self
    independent_identity_dependencies:
      rbsm-relation-meaning-compilation: [rbsm-scope-parent-guvna, rbsm-concept-accepted-guvna-meaning, rbsm-concept-semantic-compilation]
      rbsm-relation-compilation-candidate: [rbsm-scope-parent-guvna, rbsm-concept-semantic-compilation, rbsm-state-candidate]
      rbsm-relation-ratification-applicable: [rbsm-scope-parent-guvna, rbsm-concept-contract-ratification, rbsm-state-ratified]
      rbsm-relation-identity-realization: [rbsm-scope-parent-guvna, rbsm-concept-semantic-identity]
      rbsm-relation-contract-interpretation: [rbsm-scope-parent-guvna, rbsm-concept-semantic-contract]
  constraint_targets:
