      rbsm-transition-validated-reject: [rbsm-scope-parent-guvna, rbsm-state-validated, rbsm-operation-reject, rbsm-state-rejected]
      rbsm-transition-ratified-apply: [rbsm-scope-parent-guvna, rbsm-state-ratified, rbsm-operation-apply, rbsm-state-applicable]
      rbsm-transition-ratified-reject: [rbsm-scope-parent-guvna, rbsm-state-ratified, rbsm-operation-reject, rbsm-state-rejected]
      rbsm-transition-ratified-retire: [rbsm-scope-parent-guvna, rbsm-state-ratified, rbsm-operation-retire, rbsm-state-retired]
      rbsm-transition-applicable-supersede: [rbsm-scope-parent-guvna, rbsm-state-applicable, rbsm-operation-supersede, rbsm-state-superseded]
