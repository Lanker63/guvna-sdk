# REVIEW-BOUND only. Handles are structural and MUST NOT enter identity preimages.
model_kind: review-bound-semantic-model
model_state: REVIEW-BOUND
selection_reference: rbsm-selection-parent-guvna
identity_kind_policy: semantic
identity_outputs: NOT_GENERATED
semantic_ir: NOT_CREATED
contract: NOT_CREATED

handle_policy:
  non_semantic: true
  forbidden_as_identity_value: true
  forbidden_in_preimage: true
  handle_format: rbsm-<category>-<name>

sources:
  - handle: src-conceptual-contract
    path: doctrine/core/architecture/CONCEPTUAL-ARCHITECTURE.md
    section: Semantic Contract
  - handle: src-architectural-dependency
    path: doctrine/core/architecture/ARCHITECTURAL-INVARIANTS.md
    section: Architectural Dependency Principle
  - handle: src-architectural-ratification
    path: doctrine/core/architecture/ARCHITECTURAL-INVARIANTS.md
    section: Contract Ratification and Applicability
  - handle: src-architectural-invariants
    path: doctrine/core/architecture/ARCHITECTURAL-INVARIANTS.md
    section: Invariants 1-2, 31-33, 63-67
  - handle: src-epistemic-provenance
    path: doctrine/core/constitution/EPISTEMIC-INVARIANTS.md
    section: Invariants 19-22, 43
  - handle: src-semantic-identity
    path: doctrine/core/canonical/SEMANTIC-IDENTITY-AND-FILESYSTEM-REALIZATION.md
    section: Semantic Identity; Identity Is Not Version; Identity, Version, and Lifecycle
  - handle: src-lifecycle-compatibility
    path: .guvna/newplan/extracts/contract-state-and-compatibility.md
    section: Lifecycle And Acceptance; Compatibility Evaluation

governed_scope:
  handle: rbsm-scope-parent-guvna
  meaning: Guvna-owned semantic-contract boundary
  subject_meaning: Formal expression of accepted Guvna meaning for downstream realization
  source_attributions: [src-conceptual-contract, src-semantic-identity]

nodes:
  - handle: rbsm-concept-semantic-contract
    category: concept
    meaning: A Semantic Contract is a versioned expression of accepted Guvna semantics that defines the obligations and interpretation rules required of downstream realizations.
    sources: [src-conceptual-contract]
  - handle: rbsm-concept-accepted-guvna-meaning
    category: concept
    meaning: Accepted Guvna Meaning
    sources: [src-architectural-ratification]
  - handle: rbsm-concept-semantic-identity
    category: concept
    meaning: Semantic Identity is stable identity assigned according to the meaning and semantic role the artifact represents.
    sources: [src-semantic-identity]
  - handle: rbsm-concept-semantic-version
    category: concept
    meaning: Semantic Version identifies the accepted semantic form or revision of a conceptual artifact and is distinct from Semantic Identity.
    sources: [src-semantic-identity]
  - handle: rbsm-concept-lifecycle-state
    category: concept
    meaning: Lifecycle State describes an artifact's relationship to semantic evolution and remains distinct from identity, version, acceptance, provenance, and realization.
    sources: [src-semantic-identity]
  - handle: rbsm-concept-provenance
    category: concept
    meaning: Provenance preserves source and transformation lineage and does not establish authority.
    sources: [src-epistemic-provenance]
  - handle: rbsm-concept-uncertainty
    category: concept
    meaning: Insufficient, ambiguous, incomplete, or conflicting meaning remains distinguishable and is not silently replaced by assumptions.
    sources: [src-epistemic-provenance]
  - handle: rbsm-concept-semantic-compilation
    category: concept
    meaning: Guvna Semantic Compilation formally expresses accepted Guvna semantics as candidate Semantic Contracts and Guvna-owned realizations.
    sources: [src-architectural-dependency, src-architectural-invariants]
  - handle: rbsm-concept-contract-ratification
    category: concept
    meaning: Contract Ratification establishes applicability of an already-defined semantic contract and does not create Guvna meaning.
    sources: [src-architectural-ratification, src-architectural-invariants]
  - handle: rbsm-concept-guvna-authority
    category: concept
    meaning: Guvna Core owns Guvna semantics while Repository Authority establishes repository-specific truth; neither silently replaces the other.
    sources: [src-epistemic-provenance]
  - handle: rbsm-state-candidate
    category: state
    meaning: Candidate Semantic Contract
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-state-validated
    category: state
    meaning: Validated Semantic Contract
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-state-ratified
    category: state
    meaning: Ratified Semantic Contract
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-state-applicable
    category: state
    meaning: Applicable Semantic Contract
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-state-superseded
    category: state
    meaning: Superseded Semantic Contract
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-state-rejected
    category: state
    meaning: Rejected Semantic Contract
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-state-retired
    category: state
    meaning: Retired Semantic Contract
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-operation-validate
    category: operation
    meaning: Validate a candidate when structural and semantic validation succeeds, provenance is complete, and no blocking gap remains.
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-operation-ratify
    category: operation
    meaning: Ratify a validated contract through attributable human ratification input.
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-operation-apply
    category: operation
    meaning: Apply a ratified contract through separate authoritative applicability input for exact scope and effective boundary.
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-operation-reject
    category: operation
    meaning: Reject a contract only under the stated attributable authority or validation conditions.
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-operation-supersede
    category: operation
    meaning: Supersede an applicable contract through attributable successor and supersession decision.
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-operation-retire
    category: operation
    meaning: Retire a ratified or applicable contract through attributable retirement decision.
    sources: [src-lifecycle-compatibility]

relations:
  - handle: rbsm-relation-meaning-compilation
    subject: rbsm-concept-accepted-guvna-meaning
    predicate: is-formally-expressed-by
    object: rbsm-concept-semantic-compilation
    sources: [src-architectural-ratification]
  - handle: rbsm-relation-compilation-candidate
    subject: rbsm-concept-semantic-compilation
    predicate: produces
    object: rbsm-state-candidate
    sources: [src-architectural-dependency]
  - handle: rbsm-relation-ratification-applicable
    subject: rbsm-concept-contract-ratification
    predicate: establishes-lifecycle-state
    object: rbsm-state-ratified
    sources: [src-architectural-ratification]
  - handle: rbsm-relation-identity-realization
    subject: rbsm-concept-semantic-identity
    predicate: is-independent-of
    object: rbsm-external-filesystem-realization
    sources: [src-semantic-identity]
  - handle: rbsm-relation-contract-interpretation
    subject: rbsm-concept-semantic-contract
    predicate: defines-interpretation-for
    object: rbsm-external-downstream-realizations
    sources: [src-conceptual-contract, src-architectural-invariants]

external_source_references:
  - handle: rbsm-external-filesystem-realization
    meaning: Filesystem realization
    source: src-semantic-identity
    role: external-doctrinal-reference
  - handle: rbsm-external-downstream-realizations
    meaning: Downstream realizations
    source: src-conceptual-contract
    role: external-doctrinal-reference

constraints:
  - handle: rbsm-constraint-source-precedes-realization
    category: invariant
    meaning: Accepted semantic meaning precedes realization; realization does not become semantic source.
    sources: [src-architectural-invariants]
  - handle: rbsm-constraint-guvna-ownership
    category: invariant
    meaning: Guvna-owned semantics originate from governing doctrine, canonical models, architectural doctrine, and applicable Semantic Contracts.
    sources: [src-architectural-invariants]
  - handle: rbsm-constraint-authority-separation
    category: authority
    meaning: Guvna Core owns Guvna semantics and Repository Authority owns repository-specific truth; the authorities remain distinct.
    sources: [src-epistemic-provenance]
  - handle: rbsm-constraint-no-semantic-invention
    category: invariant
    meaning: Semantic Compilation formally expresses accepted meaning and shall not silently create new meaning.
    sources: [src-architectural-ratification]
  - handle: rbsm-constraint-nonapplicable-without-ratification
    category: condition
    meaning: A candidate, draft, generated, parsed, persisted, or consumed contract is not applicable without governing ratification and applicability conditions.
    sources: [src-architectural-ratification, src-architectural-invariants]
  - handle: rbsm-constraint-distinct-dimensions
    category: invariant
    meaning: Identity, version, lifecycle, acceptance, provenance, and realization remain distinct.
    sources: [src-semantic-identity]
  - handle: rbsm-constraint-provenance
    category: invariant
    meaning: Required provenance is preserved across material transformations and provenance does not create authority.
    sources: [src-epistemic-provenance, src-architectural-invariants]
  - handle: rbsm-constraint-semantic-compatibility
    category: compatibility
    meaning: Semantic compatibility is not established by parsing, schema shape, transport, implementation version, or execution.
    sources: [src-architectural-invariants]
  - handle: rbsm-constraint-realization-non-invention
    category: invariant
    meaning: Runtime, SDK, Host, generated code, and tooling realize approved semantics and do not invent them.
    sources: [src-architectural-invariants]
  - handle: rbsm-constraint-uncertainty
    category: ambiguity
    meaning: Unresolved ambiguity, contradiction, insufficiency, and incomplete meaning remain explicit rather than silently assumed.
    sources: [src-epistemic-provenance]
  - handle: rbsm-constraint-compatibility-fail-closed
    category: condition
    meaning: Required semantic compatibility not established produces a contract-defined fail-closed outcome rather than inferred compatibility.
    sources: [src-architectural-invariants]
  - handle: rbsm-constraint-transition-fail-closed
    category: condition
    meaning: Missing, conflicting, stale, or unsupported transition input fails closed.
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-obligation-preserve-boundary
    category: invariant
    meaning: All realizations preserve governing distinctions, source ownership, and the parent semantic boundary.
    sources: [src-architectural-invariants]
  - handle: rbsm-obligation-preserve-provenance
    category: invariant
    meaning: All realizations preserve required provenance across material transformations.
    sources: [src-architectural-invariants]
  - handle: rbsm-obligation-no-derived-authority
    category: invariant
    meaning: No realization, filesystem organization, generated artifact, cache, index, implementation, or execution establishes semantic authority.
    sources: [src-architectural-invariants, src-semantic-identity]
  - handle: rbsm-obligation-preserve-dimensions
    category: invariant
    meaning: All realizations preserve identity, version, lifecycle, acceptance, provenance, and realization distinctions.
    sources: [src-semantic-identity]
  - handle: rbsm-obligation-preserve-guvna-history
    category: invariant
    meaning: Guvna semantic history preserves prior and current doctrine, semantic contracts, semantic deltas, and generation lineage.
    sources: [src-architectural-invariants]
  - handle: rbsm-reference-canonical-identity
    category: condition
    meaning: An authority-bearing artifact carries or exposes canonical Semantic Identity on an authoritative surface.
    sources: [src-semantic-identity]

transitions:
  - handle: rbsm-transition-candidate-validate
    from: rbsm-state-candidate
    operation: rbsm-operation-validate
    to: rbsm-state-validated
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [structural_and_semantic_validation_succeeds, provenance_complete, no_blocking_gap]
      authority_requirement: none
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-candidate-reject
    from: rbsm-state-candidate
    operation: rbsm-operation-reject
    to: rbsm-state-rejected
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [attributable_authority_rejection_or_explicit_validation_incompatibility_under_approved_requirement_set]
      authority_requirement: conditional
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-validated-ratify
    from: rbsm-state-validated
    operation: rbsm-operation-ratify
    to: rbsm-state-ratified
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [human_ratification_input]
      authority_requirement: human_authority_identity_scope_contract_identity_version_and_provenance
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-validated-reject
    from: rbsm-state-validated
    operation: rbsm-operation-reject
    to: rbsm-state-rejected
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [attributable_authority_rejection]
      authority_requirement: attributable_authority
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-ratified-apply
    from: rbsm-state-ratified
    operation: rbsm-operation-apply
    to: rbsm-state-applicable
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [separate_authoritative_applicability_input, exact_governed_scope, effective_boundary]
      authority_requirement: applicable_authoritative_input
      effective_boundary_requirement: required
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-ratified-reject
    from: rbsm-state-ratified
    operation: rbsm-operation-reject
    to: rbsm-state-rejected
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [attributable_authority_rejection]
      authority_requirement: attributable_authority
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-ratified-retire
    from: rbsm-state-ratified
    operation: rbsm-operation-retire
    to: rbsm-state-retired
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [attributable_retirement_decision]
      authority_requirement: attributable_authority
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-applicable-supersede
    from: rbsm-state-applicable
    operation: rbsm-operation-supersede
    to: rbsm-state-superseded
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [attributable_successor_and_supersession_decision]
      authority_requirement: attributable_authority
      successor_requirement: required
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-transition-applicable-retire
    from: rbsm-state-applicable
    operation: rbsm-operation-retire
    to: rbsm-state-retired
    context:
      required_context: [current_lifecycle_state, operation, preconditions, scope, contract_identity_version_context, provenance]
      guards: [attributable_retirement_decision]
      authority_requirement: attributable_authority
      provenance_requirement: required
      fail_closed_on: [missing, conflicting, stale, unsupported]
    sources: [src-lifecycle-compatibility]

compatibility_capabilities:
