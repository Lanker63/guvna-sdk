collection_ordering_policy_map:
  rbsm-collection-nodes: unordered
  rbsm-collection-relations: unordered
  rbsm-collection-constraints: unordered
  rbsm-collection-transitions: unordered
  rbsm-collection-compatibility-capabilities: unordered
  rbsm-collection-provenance-sources: unordered
  rbsm-collection-conflict-sources: unordered
  rbsm-collection-attached-provenance: unordered
  rbsm-collection-transformation-dependencies: ordered

transformation_dependency_chains: []

empty_collection_dispositions:
  - collection: compatibility_requirements
    reason: No authoritative prior comparison subject, requirement set, predicate inputs, required interpretation, authority reference, or provenance is selected for the initial non-comparative population.
  - collection: contracts
    reason: No Contract is created at the review-model boundary.
  - collection: realizations
    reason: Runtime, SDK, Host, and Projection realizations remain outside the parent model boundary.
  - collection: authority_decisions
    reason: No authority decision is created by review-bound population.
  - collection: acceptances
    reason: No acceptance record is created by review-bound population.
  - collection: delegations
    reason: No delegation record is selected for the initial parent model.
  - collection: provenance_conflicts
    reason: No approved parent conflict record is selected.
    ordering: UNCLASSIFIED

excluded_specializations:
  - Repository-Adoption specialization semantics and repository acceptance workflow
  - repository-specific truth, content, governance, and constraints
  - Runtime, SDK, Host, and Projection interfaces or schemas
  - normalization, projection, transport, persistence, provider/model, filesystem, and process metadata