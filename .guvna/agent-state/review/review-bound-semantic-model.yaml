      - rbsm-obligation-preserve-boundary
      - rbsm-obligation-preserve-provenance
      - rbsm-obligation-no-derived-authority
      - rbsm-obligation-preserve-dimensions
      - rbsm-obligation-preserve-guvna-history
      - rbsm-reference-canonical-identity
    same_preimage_dependency: self
    independent_identity_dependencies: [rbsm-scope-parent-guvna]
  transition_targets:
    targets:
      - rbsm-transition-candidate-validate
      - rbsm-transition-candidate-reject
      - rbsm-transition-validated-ratify
      - rbsm-transition-validated-reject
      - rbsm-transition-ratified-apply
      - rbsm-transition-ratified-reject
      - rbsm-transition-ratified-retire
      - rbsm-transition-applicable-supersede
      - rbsm-transition-applicable-retire
    same_preimage_dependency: self
    independent_identity_dependencies:
      rbsm-transition-candidate-validate: [rbsm-scope-parent-guvna, rbsm-state-candidate, rbsm-operation-validate, rbsm-state-validated]
      rbsm-transition-candidate-reject: [rbsm-scope-parent-guvna, rbsm-state-candidate, rbsm-operation-reject, rbsm-state-rejected]
