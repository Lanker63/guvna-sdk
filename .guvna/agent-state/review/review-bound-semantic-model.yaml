  - handle: rbsm-capability-failure-semantics-preserved
    predicate: failure-semantics-preserved
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-capability-lifecycle-semantics-preserved
    predicate: lifecycle-semantics-preserved
    sources: [src-lifecycle-compatibility]
  - handle: rbsm-capability-scope-compatible
    predicate: scope-compatible
    sources: [src-lifecycle-compatibility]

provenance_attributions:
