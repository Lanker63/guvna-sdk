phase: 3
authority_gate: Post-implementation conformance review
status: APPROVED
governing_approval: .guvna/agent-state/proposals/applicability-determination-conformance-review-proposal.yaml

review: applicability-determination
inputs:
  implementation_scope: approved_applicability_only
  evidence_paths:
    - .guvna/agent-state/evidence/compiler/**/*.yaml
    - .guvna/agent-state/evidence/compiler/**/*.md
  changed_path_manifest_required: true

procedure:
  - verify_approved_changed_paths
  - verify_authoritative_inputs_only
  - exercise_applicable
  - exercise_not_applicable
  - exercise_indeterminate
  - exercise_fail_closed_invalid_or_unavailable_inputs
  - verify_exact_governed_scope
  - verify_validity_and_effective_boundary
  - verify_provenance_preservation
  - verify_no_ratification_or_authority_mutation
  - verify_no_unrelated_compiler_or_unresolved_capability_implementation

finding_classes:
  - conformant
  - non-conformant
  - indeterminate

stop_conditions:
  - missing_required_evidence
  - ambiguous_provenance
  - unresolved_scope_match
  - authority_boundary_violation
  - unauthorized_mutation

output:
  evidence_paths_only:
    - .guvna/agent-state/evidence/compiler/**/*.yaml
    - .guvna/agent-state/evidence/compiler/**/*.md
  implementation: false
  doctrine_mutation: false
  authority_mutation: false
