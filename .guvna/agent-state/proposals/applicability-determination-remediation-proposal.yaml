phase: 3
authority_gate: Post-implementation conformance remediation review
status: APPROVED
governing_finding: Applicability Determination conformance audit

remediation_scope:
  authority_input_validation:
    authorize: true
    requirements:
      - attributable authority identity
      - decision identity
      - decision version or effective revision
      - provenance sufficient to establish external supply
    fail_closed_inputs:
      - absent
      - malformed
      - ambiguous
      - conflicting
      - stale
      - revoked
      - unsupported
    authority_mutation: false
    ratification: false
  validity_effective_boundary_evaluation:
    authorize: true
    explicit_validity_evidence_required: true
    explicit_effective_boundary_evidence_required: true
    exact_governed_scope_evaluation_required: true
    terminal_result_bypass_prohibited: true
    fail_closed: true
  conformance_tests:
    authorize: true
    required:
      - malformed_or_absent_authority_identity
      - invalid_authority_decision
      - stale_authoritative_input
      - revoked_authoritative_input
      - conflicting_authoritative_input
      - unsupported_authoritative_input
      - applicable
      - not-applicable
      - indeterminate
      - fail_closed_behavior
      - exact_governed_scope_evaluation
      - validity_effective_boundary_evaluation
      - provenance_preservation_for_each_result
      - ratification_mutation_prohibition
      - authority_decision_mutation_prohibition
      - mutation_boundary_enforcement
  process_state_reconciliation:
    authorize: true
    purpose: process_evidence_only
    semantic_scope_change: false
    mutation_scope_change: false

workspace_reference:
  status: SEPARATE_PREREQUISITE
  found: false
  justification: "No approved filesystem convention exists for compiled contracts; creating or placing a ratified Applicable Semantic Contract artifact requires a separate authority and location decision."
  required_before_contract_dependent_conformance: true
  included_in_remediation_implementation_scope: false
  agent_may_create_or_relocate_contract_artifact: false

preserved_exclusions:
  candidate_contract_ratification: true
  authority_decision_creation_or_alteration: true
  delegation_or_revocation: true
  runtime_sdk_projection_or_contract_implementation: true
  compatibility_or_other_unresolved_gate_2_capabilities: true
  general_compiler_stage_implementation: true
  ratified_applicable_contract_artifact_creation_or_relocation: true
  doctrine_publication_or_generated_artifact_mutation: true

mutation_scope:
  exact_paths:
    - core/src/compiler/**/*.ts
    - core/tests/compiler/**/*.test.ts
    - core/tsconfig.json
    - core/vitest.config.mts
    - .guvna/agent-state/evidence/compiler/**/*.yaml
    - .guvna/agent-state/evidence/compiler/**/*.md
    - .guvna/agent-state/state.yaml
  implementation_authorized_by_proposal: false

requires_human_approval: false
implementation_performed: true
