phase: 3
authority_gate: Gate 3 - Compiler Authority Gate
status: APPROVED
semantic_source: doctrine/core/**
excluded_semantic_sources:
  - doctrine/agentic/**
approved_semantic_input:
  - .guvna/agent-state/proposals/gate-2-semantic-ir-proposal.yaml
  - .guvna/agent-state/proposals/gate-2-semantic-ir-proposal.md
architecture:
  pipeline:
    - Discover
    - Parse
    - Normalize
    - Resolve
    - Compile
    - Validate
  semantic_output: derived Semantic IR
  semantic_authority: false
  candidate_contract_output: false
  repository_truth_authority: false
stage_obligations:
  Discover:
    - establish doctrine/core source boundary
    - preserve source identities and sections
    - produce reproducible source manifest
  Parse:
    - extract structured claims and references
    - preserve source locations and provenance
    - reject malformed or unsupported structures
  Normalize:
    - remove representational variance only where equivalence is established
    - do not infer meaning or unresolved algorithms
  Resolve:
    - bind references
    - check ownership, authority, dependencies, conflicts, and provenance
    - block unresolved references and equal-authority conflicts
  Compile:
    - construct approved generic Semantic IR
    - record transformations and provenance
    - do not create Applicable Contracts or repository truth
  Validate:
    - check structural and semantic consistency
    - check authority boundaries, provenance, compatibility, determinism, and mutation scope
    - validate compatibility and applicability presence, structural validity, internal consistency, and approved Semantic IR representation
    - do not invent, define, or execute unresolved compatibility or applicability algorithms
    - indeterminate results under unresolved algorithms are not compiler semantic failures unless an approved semantic rule requires blocking
semantic_gap_behavior:
  record_shape:
    - ID
    - Source
    - Missing semantic
    - Impact
    - Required authority
  unresolved_semantics_fail_closed: true
  infer_defaults: false
  infer_precedence: false
  use_implementation_behavior_as_authority: false
  preserve_source_claims_and_provenance: true
blocking_conditions:
  - semantic ambiguity
  - unresolved reference
  - equal-authority conflict without attributable precedence
  - invalid ownership or authority relationship
  - provenance loss
  - absent, structurally invalid, or internally inconsistent compatibility or applicability requirements
  - non-deterministic output
  - mutation outside the approved compiler mutation boundary
provenance_obligations:
  material_ir_objects_traceable: true
  transformations_recorded: true
  conflicts_and_uncertainty_preserved: true
  resolutions_attributable: true
determinism_obligations:
  canonicalization_obligations_from_gate_2_only: true
  deterministic_compilation_admitted_for_identical_approved_inputs_once_approved_algorithms_are_provided: true
  gate_3_does_not_establish_canonicalization_ordering_serialization_or_identity_algorithms: true
  concrete_serialization_algorithm_unresolved: true
  concrete_hash_algorithm_unresolved: true
  concrete_ordering_algorithm_unresolved: true
  concrete_version_and_compatibility_algorithms_unresolved: true
  lifecycle_and_transition_algorithms_unresolved: true
mutation_scope:
  proposal_artifacts:
    - .guvna/agent-state/proposals/gate-3-compiler-proposal.md
    - .guvna/agent-state/proposals/gate-3-compiler-proposal.yaml
  implementation_scope_requires_gate_3_approval: true
  excluded:
    - doctrine/**
    - core/runtime/**
    - core/sdk/**
    - repository semantic inputs
    - Runtime, SDK, Projection, or Contract artifacts
    - publication and generated output locations
requested_decision: Approve or revise compiler architecture, stage boundaries, fail-closed behavior, provenance, determinism obligations, and mutation scope
next_action: Prepare compiler implementation proposal
requires_approval: false
